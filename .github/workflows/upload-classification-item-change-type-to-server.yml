name: classification-item-change-type adocbuild and upload files to server

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - vocabularies/classification-item-change-type/**

jobs:
  adoc_build_and_upload_files:
    runs-on: ubuntu-latest
    name: asciidoctor build
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build html bokmål
        id: adocbuild-nb
        uses: Analog-inc/asciidoctor-action@master
        with:
          shellcommand: "asciidoctor -a data-uri -o vocabularies/classification-item-change-type/classification-item-change-type-nb.html -a lang=nb vocabularies/classification-item-change-type/main-nb.adoc"
      - name: Build html english
        id: adocbuild-en
        uses: Analog-inc/asciidoctor-action@master
        with:
          shellcommand: "asciidoctor -a data-uri -o vocabularies/classification-item-change-type/classification-item-change-type-en.html -a lang=en vocabularies/classification-item-change-type/main-en.adoc"

      - name: Upload files to static-rdf-server
        uses: Informasjonsforvaltning/upload-files-to-static-rdf-server-action@84beeeacd364f310ef6a253bc079354cdf62e5dd
        id: upload-files
        with:
          ontology-type: "vocabulary"
          ontology: "classification-item-change-type"
          host: "https://data.norge.no"
          api-key: ${{ secrets.STATIC_RDF_SERVER_API_KEY }}
          files: |
            vocabularies/classification-item-change-type/classification-item-change-type.ttl text/turtle en
            vocabularies/classification-item-change-type/classification-item-change-type-nb.html text/html nb          
            vocabularies/classification-item-change-type/classification-item-change-type-en.html text/html en
