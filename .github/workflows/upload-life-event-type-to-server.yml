name: life-event-type adocbuild and upload files to server

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - vocabularies/life-event-type/**
  workflow_dispatch:

jobs:
  adoc_build_and_upload_files:
    name: Upload vocabulary to static-rdf-server
    # Prevent a workflow_dispatch from a non-main branch from publishing to data.norge.no.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: Informasjonsforvaltning/workflows/.github/workflows/specification-upload-files.yaml@main
    with:
      program_html: |
        asciidoctor -a data-uri -o vocabularies/life-event-type/life-event-type-nb.html -a lang=nb vocabularies/life-event-type/main-nb.adoc
        asciidoctor -a data-uri -o vocabularies/life-event-type/life-event-type-en.html -a lang=en vocabularies/life-event-type/main-en.adoc
      host: https://data.norge.no
      ontology: life-event-type
      ontology-type: vocabulary
      files: |
        vocabularies/life-event-type/life-event-type.ttl text/turtle en
        vocabularies/life-event-type/life-event-type-nb.html text/html nb
        vocabularies/life-event-type/life-event-type-en.html text/html en
    secrets:
      STATIC_RDF_SERVER_API_KEY: ${{ secrets.STATIC_RDF_SERVER_API_KEY }}
